# Optional global settings. Copy to config/imports/_config.yml. Read lazily on the first
# ApplicationImport.configuration access, not at boot.
# Keys: config_path, defaults. Flat, or scoped: `shared:` deep-merged with the current
# `<env>:` section (development / test / production).
shared:
  config_path: config/imports     # where <name>.yml definitions live (relative to Rails.root)
  defaults:                       # deep-merged under every definition; definition values win
    file:                         # allowed sections: handler, file, output, on_error
      max_size: 10485760
      encoding: "UTF-8"
    output:
      batch_size: 1000
    on_error:
      default: abort
test:
  defaults:
    file:
      max_size: 1048576
