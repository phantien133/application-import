# Example import definition. Copy to config/imports/users.yml (or any path passed
# to ApplicationImport.definition / run). Shared defaults come from _config.yml.

handler: Imports::UsersHandler

file:
  checker: Imports::UsersFileChecker

  format: csv          # built-in reader: csv (default) | xlsx (not implemented yet)
  # reader: Imports::UsersReader   # custom reader (< ApplicationImport::Readers::Base), overrides format
  formats: [ csv, xlsx ]
  name_pattern: '\Ausers_\d{8}\.(csv|xlsx)\z'
  max_size: 10485760
  encoding: "UTF-8"   # a BOM (UTF-8/UTF-16) overrides it
  headers: true       # false: no header row, cells map to columns in the order below
  require_all_headers: false   # true: every column below must have a header (default: only required ones)
  unknown_headers: skip   # headers not in columns: skip (default) | keep (attributes keyed by header)
                          # | assign (keep + set matching output.model attributes as read, no cast) | reject (error)
  # exact headers (all columns, nothing extra): require_all_headers: true + unknown_headers: reject
  extra_cells: warn       # cells beyond the headers (kept in row.raw): warn (default) | ignore | reject (file error, halts)
  csv:                       # CSV.new options; encoding is file.encoding, not here
    col_sep: ","
    quote_char: '"'
    # row_sep: "\r\n"        # default: auto-detect
    liberal_parsing: false
    strip: true               # or one character to strip, e.g. "*"
    skip_lines: '\A#'         # regexp: skip comment lines
    max_field_size: 10000
    # passthrough:            # handed to CSV.new as-is, NOT validated, overrides the above
    #   nil_value: ""
  xlsx:
    sheet: 0
columns:
  email:
    header: "Email"
    aliases: [ "E-mail", "Mail" ]
    header_pattern: '\Ae-?mail( address)?\z'   # regexp (or list), case-insensitive; names win
    type: string
    required: true
    max_length: 255
    format: email

  name:
    header: "Name"
    min_length: 2
    max_length: 100

  age:
    header: "Age"
    type: integer
    min: 0
    max: 150

  balance:
    header: "Balance"
    type: decimal
    min: 0

  active:
    header: "Active"
    type: boolean

  phone:
    header: "Phone"
    caster: Imports::PhoneCaster   # custom caster (< ApplicationImport::Casters::Base) instead of the type's
  role:
    header: "Role"
    # inclusion is checked on the value in the file, before the map transformer below
    # (which already rejects unknown labels with strict: true)
    inclusion: [ "Quản trị", "Thành viên", admin, member, guest ]

  joined_on:
    header: "Joined"
    type: date
    date_format: "%d/%m/%Y"   # strict: the whole value must match
    min: "2000-01-01"

  last_login_at:
    header: "Last login"
    type: datetime
    # no date_format: ISO 8601, else lenient Time.zone.parse (needs year, month, day)
    # with a warning once per run — set date_format to parse exactly

# --- Transformers ---------------------------------------------------------------
# Run for each row after cast + column rules, in order, each returning attributes to
# merge. Built-in `type` (concat, default, map, normalize, context) or your `class`
# (< ApplicationImport::Transformers::Base, call(attributes, row) -> Hash).
transformers:
  - type: normalize
    attributes: [ email ]
    with: [ strip, downcase ]
  - type: default
    attribute: role
    value: member
  - type: map
    attribute: role
    values: { "Quản trị": admin, "Thành viên": member }
  - type: concat
    from: [ name, email ]
    to: label
    separator: " - "
  - type: context
    key: user_id
    to: created_by_id
  # - class: Imports::Users::SlugTransformer
  #   source: name

# --- Mapper -----------------------------------------------------------------------
# One mapper, after the transformers, before handler.map_row and the validators:
# turns the attributes into the ones the record gets. `type: rename` or your `class`
# (< ApplicationImport::Mappers::Base, call(attributes, row) -> Hash).
mapper:
  type: rename
  attributes: { joined_on: created_on }
  # only: true    # keep only the renamed attributes

# --- Validators ----------------------------------------------------------------
# Run after the per-column checks. Either `type` (registered validator) or
# `class` (any class answering .call or
#   scope: file (default) -> .call(rows, errors, options), rows = still-valid rows
#   scope: row            -> .call(row, options)
validators:
  file:
    - class: Imports::Users::FileDateValidator
  row:
    - type: model
      model: User
      context: import
      except: [ uniqueness ]
    - class: Imports::Users::DomainValidator
      allowed_domains: [ example.com ]
  rows:
    - type: unique_in_file
      keys: [ email ]
      case_sensitive: false
    - type: unique_in_file
      keys: [ name, created_on ]   # names after the mapper (joined_on was renamed); a missing key fails the run
  verify:
    - class: Imports::Users::ManagersExistValidator

output:
  mode: bulk              # bulk (default with model: activerecord-import) | save (record.save each) | raw (no DB)
  model: User
  batch_size: 1000        # rows per Model.import call
  transaction: true       # one transaction for the whole write; an abort rolls it back
  upsert:                 # bulk only -> on_duplicate_key_update
    conflict_target: [ email ]
    update: [ name, age, active ]
  import:                 # bulk only: any activerecord-import option, as-is (not validated)
    validate: true
  # save:                 # save only: options for record.save, as-is (e.g. validate: false)
# Row-level errors (file-level errors always stop the import):
#   abort: record the error and stop; skip: record it, drop the row, continue;
#   allow: record it, keep the row, continue.
# Short form: `on_error: abort` (or skip) sets the default for every code.
on_error:
  default: abort                    # abort | skip, for codes not listed below
  allow: [ duplicate ]              # example
  skip: [ required, invalid_type ]  # example
  row_errors: first                 # first (default): stop the row at its first failing check | all: collect every error
