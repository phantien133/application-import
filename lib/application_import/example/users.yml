# Example import definition. Copy to config/imports/users.yml (or any path passed
# to ApplicationImport.definition / run). Shared defaults come from _config.yml.

handler: Imports::UsersHandler

file:
  checker: Imports::UsersFileChecker

  format: csv          # built-in reader: csv (default) | xlsx (not implemented yet)
  # reader: Imports::UsersReader   # custom reader (< ApplicationImport::Readers::Base), overrides format
  formats: [ csv, xlsx ]
  name_pattern: '\Ausers_\d{8}\.(csv|xlsx)\z'
  max_size: 10485760
  max_rows: 100000
  encoding: "UTF-8"   # a BOM (UTF-8/UTF-16) overrides it
  headers: true       # false: no header row, cells map to columns in the order below
  csv:                       # CSV.new options; encoding is file.encoding, not here
    col_sep: ","
    quote_char: '"'
    # row_sep: "\r\n"        # default: auto-detect
    liberal_parsing: false
    strip: true               # or the characters to strip, e.g. " \t"
    skip_lines: '\A#'         # regexp: skip comment lines
    max_field_size: 10000
    # passthrough:            # handed to CSV.new as-is, NOT validated, overrides the above
    #   nil_value: ""
  xlsx:
    sheet: 0
columns:
  email:
    header: "Email"
    aliases: [ "E-mail", "Mail" ]
    type: string
    required: true
    max_length: 255
    format: email

  name:
    header: "Name"
    min_length: 2
    max_length: 100

  age:
    header: "Age"
    type: integer
    min: 0
    max: 150

  balance:
    header: "Balance"
    type: decimal
    min: 0

  active:
    header: "Active"
    type: boolean

  role:
    header: "Role"
    inclusion: [ admin, member, guest ]

  joined_on:
    header: "Joined"
    type: date
    date_format: "%d/%m/%Y"
    min: "2000-01-01"

  last_login_at:
    header: "Last login"
    type: datetime

# --- Validators ----------------------------------------------------------------
# Run after the per-column checks. Either `type` (registered validator) or
# `class` (any class answering .call or
#   scope: file (default) -> .call(rows, errors, options), rows = still-valid rows
#   scope: row            -> .call(row, options)
validators:
  file:
    - class: Imports::Users::FileDateValidator
  row:
    - type: model
      model: User
      context: import
      except: [ uniqueness ]
    - class: Imports::Users::DomainValidator
      allowed_domains: [ example.com ]
  rows:
    - type: unique_in_file
      keys: [ email ]
      case_sensitive: false
    - type: unique_in_file
      keys: [ name, joined_on ]
  verify:
    - class: Imports::Users::ManagersExistValidator

output:
  mode: raw
  model: User
  batch_size: 1000
  upsert:
    conflict_target: [ email ]
    update: [ name, age, active ]
# Row-level errors (file-level errors always stop the import):
#   abort: record the error and stop; skip: record it, drop the row, continue;
#   allow: record it, keep the row, continue.
# Short form: `on_error: abort` (or skip) sets the default for every code.
on_error:
  default: abort                    # abort | skip, for codes not listed below
  allow: [ duplicate ]              # example
  skip: [ required, invalid_type ]  # example
